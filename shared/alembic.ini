# Alembic config for the shared database schema.
#
# Run from the repo root so `import shared` resolves, pointing at this file:
#   alembic -c shared/alembic.ini upgrade head
#   alembic -c shared/alembic.ini revision --autogenerate -m "add X"
#
# The database URL is NOT set here — env.py reads POSTGRES_DSN at runtime (the
# same variable the jobs and gateway use), so no credentials live in the repo.

[alembic]
script_location = %(here)s/migrations
# Put the repo root (this file's parent's parent) on sys.path for `import shared`.
prepend_sys_path = %(here)s/..
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
