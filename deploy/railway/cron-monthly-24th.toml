# Railway "Config as Code" for the 24th-of-month pipeline cron service.
# In the service's Settings → point "Railway Config File" at this path
# (deploy/railway/cron-monthly-24th.toml). Root Directory stays "/".
#
# Runs the whole downstream chain in ONE container, in order, on the 24th at
# 06:00 UTC — after the Land Registry delta (23rd):
#   reconciliation -> coverage mart -> the 5 per-table quality snapshots.
# Sequential execution guarantees each step's data is committed before the next
# reads it, replacing the old 06:00 / 08:00 / 09:00 staggered schedules.
# See services/jobs/ingestion/reconciliation/ and services/jobs/ingestion/data_quality/.

[build]
builder = "nixpacks"

[deploy]
startCommand = "bash services/scripts/run_jobs.sh reconciliation_monthly_job mart_coverage_metrics_job land_registry_sales_quality_job epc_domestic_certificates_quality_job os_open_uprn_quality_job property_uprn_mapping_quality_job key_duplication_quality_job"
cronSchedule = "0 6 24 * *"
restartPolicyType = "NEVER"
