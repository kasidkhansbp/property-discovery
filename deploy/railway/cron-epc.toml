# Railway "Config as Code" for the EPC monthly cron service.
# In the service's Settings → point "Railway Config File" at this path
# (deploy/railway/cron-epc.toml). Root Directory stays "/".
#
# EPC's bulk file is republished early each month; this refreshes the table on
# the 5th at 04:00 UTC. See services/jobs/ingestion/epc/schedules.py.

[build]
builder = "nixpacks"

[deploy]
startCommand = "bash services/scripts/run_jobs.sh epc_monthly_job"
cronSchedule = "0 4 5 * *"
# Don't auto-restart a finished/failed cron run — wait for the next tick (or a
# manual re-run). Avoids a failing heavy job retry-looping and burning minutes.
restartPolicyType = "NEVER"
